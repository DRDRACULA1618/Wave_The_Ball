<style>:root {
  color-scheme: dark;
  font-family: "Courier New", Courier, monospace;
  background: #01040a;
  --game-ratio: 0.5625;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: radial-gradient(circle at 50% 25%, #12325a 0, #06101f 45%, #01040a 100%);
}
body {
  display: grid; place-items: center;
  padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#game-shell {
  position: relative;
  width: min(100vw, calc(100dvh * var(--game-ratio)));
  height: min(100dvh, calc(100vw / var(--game-ratio)));
  min-width: 280px; min-height: 498px; overflow: hidden; background: #020813;
  border: 1px solid rgba(64,204,255,.35);
  box-shadow: 0 0 0 2px rgba(4,23,44,.95), 0 0 45px rgba(21,180,239,.25), 0 25px 80px rgba(0,0,0,.7);
}
body[data-layout="desktop"] { --game-ratio: 1.7777777778; }
body[data-layout="desktop"] #game-shell { min-width: 640px; min-height: 360px; }
#game { display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; outline:none; cursor:default; }
#loading {
  position:absolute; inset:0; z-index:5; display:grid; place-items:center; padding:24px; text-align:center;
  font-size:clamp(13px,3.2vw,24px); font-weight:900; letter-spacing:.11em; color:#f8fbff;
  background:radial-gradient(circle at 50% 38%,rgba(25,181,239,.18),transparent 42%),#04101f;
  transition:opacity 220ms ease;
}
#loading::after {
  content:""; width:min(280px,74%); height:8px; margin-top:70px; position:absolute;
  border:2px solid #1fc8ff; background:linear-gradient(90deg,#0b57c4 0 35%,#20c9ff 35% 72%,#0b2443 72%);
  box-shadow:0 0 14px rgba(31,200,255,.6); animation:loadingPulse 1s steps(6,end) infinite;
}
#loading.is-hidden { opacity:0; pointer-events:none; }
@keyframes loadingPulse { 0%,100%{filter:brightness(.82)} 50%{filter:brightness(1.35)} }
</style>

  const sound = {
    context: null,

    crowdWanted: false,
    crowdSource: null,
    crowdGain: null,
    crowdLfo: null,
    crowdLfoGain: null,
    crowdBuffer: null,
    init() {
      if (this.muted) return;
      try {
        if (!this.context) {
          this.context = new (window.AudioContext || window.webkitAudioContext)();
          this.master = this.context.createGain();
          this.master.gain.value = 0.82;
          this.compressor = this.context.createDynamicsCompressor();
          this.compressor.threshold.value = -20;
          this.compressor.knee.value = 16;
          this.compressor.ratio.value = 4;
          this.compressor.attack.value = 0.008;
          this.compressor.release.value = 0.22;
          this.master.connect(this.compressor);
          this.compressor.connect(this.context.destination);
          this.buildCrowdBed();
        }
        if (this.context.state === "suspended") this.context.resume().catch(() => {});
        this.applyCrowdLevel();
      } catch (_err) {
        this.context = null;
        this.master = null;
      }
    },
    makeNoiseBuffer(seconds = 6) {
      if (!this.context) return null;
      const length = Math.max(1, Math.floor(this.context.sampleRate * seconds));
      const buffer = this.context.createBuffer(1, length, this.context.sampleRate);
      const data = buffer.getChannelData(0);
      let b0 = 0;
      let b1 = 0;
      let b2 = 0;
      let b3 = 0;
      let b4 = 0;
      let b5 = 0;
      let b6 = 0;
      for (let i = 0; i < length; i += 1) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        const pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        b6 = white * 0.115926;
        data[i] = Math.max(-1, Math.min(1, pink * 0.085));
      }
      return buffer;
    },
    buildCrowdBed() {
      if (!this.context || !this.master || this.crowdSource) return;
      this.crowdBuffer = this.makeNoiseBuffer(7);
      if (!this.crowdBuffer) return;
      const source = this.context.createBufferSource();
      source.buffer = this.crowdBuffer;
      source.loop = true;
      const high = this.context.createBiquadFilter();
      high.type = "highpass";
      high.frequency.value = 90;
      high.Q.value = 0.55;
      const low = this.context.createBiquadFilter();
      low.type = "lowpass";
      low.frequency.value = 1850;
      low.Q.value = 0.7;
      const gain = this.context.createGain();
      gain.gain.value = 0.0001;
      const lfo = this.context.createOscillator();
      lfo.type = "sine";
      lfo.frequency.value = 0.14;
      const lfoGain = this.context.createGain();
      lfoGain.gain.value = 0.0045;
      source.connect(high);
      high.connect(low);
      low.connect(gain);
      gain.connect(this.master);
      lfo.connect(lfoGain);
      lfoGain.connect(gain.gain);
      source.start();
      lfo.start();
      this.crowdSource = source;
      this.crowdGain = gain;
      this.crowdLfo = lfo;
      this.crowdLfoGain = lfoGain;
    },
    applyCrowdLevel() {
      if (!this.context || !this.crowdGain) return;
      const now = this.context.currentTime;
      const active = !this.muted && this.crowdWanted;
      const target = active ? 0.027 : 0.0001;
      this.crowdGain.gain.cancelScheduledValues(now);
      this.crowdGain.gain.setValueAtTime(Math.max(0.0001, Math.abs(this.crowdGain.gain.value)), now);
      this.crowdGain.gain.linearRampToValueAtTime(target, now + 0.32);
      if (this.crowdLfoGain) {
        this.crowdLfoGain.gain.cancelScheduledValues(now);
        this.crowdLfoGain.gain.setValueAtTime(Math.max(0, this.crowdLfoGain.gain.value), now);
        this.crowdLfoGain.gain.linearRampToValueAtTime(active ? 0.0045 : 0, now + 0.28);
      }
      if (this.master) {
        this.master.gain.cancelScheduledValues(now);
        this.master.gain.setValueAtTime(Math.max(0.0001, this.master.gain.value), now);
        this.master.gain.linearRampToValueAtTime(this.muted ? 0.0001 : 0.82, now + 0.18);
      }
    },
    setCrowdActive(active) {
      this.crowdWanted = Boolean(active);
      if (!this.muted) this.init();
      this.applyCrowdLevel();
    },
    setMuted(value) {
      this.muted = Boolean(value);
      if (!this.muted) this.init();
      this.applyCrowdLevel();
    },
    tone(freq, duration = 0.08, type = "square", volume = 0.025, delay = 0) {
      if (this.muted) return;
      this.init();
      if (!this.context || !this.master) return;
      const start = this.context.currentTime + delay;
      const osc = this.context.createOscillator();
      const gain = this.context.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(volume, start);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.connect(gain);
      gain.connect(this.master);
      osc.start(start);
      osc.stop(start + duration);
    },
    crowdCheer(intensity = 1) {
      if (this.muted) return;
      this.init();
      if (!this.context || !this.master || !this.crowdBuffer) return;
      const now = this.context.currentTime;
      const strength = Math.max(0.65, Math.min(1.55, intensity));
      const duration = 1.35 + strength * 0.38;
      for (let layer = 0; layer < 2; layer += 1) {
        const source = this.context.createBufferSource();
        source.buffer = this.crowdBuffer;
        const band = this.context.createBiquadFilter();
        band.type = "bandpass";
        band.frequency.value = layer === 0 ? 720 : 1320;
        band.Q.value = layer === 0 ? 0.48 : 0.72;
        const gain = this.context.createGain();
        const start = now + layer * 0.055;
        const peak = (layer === 0 ? 0.105 : 0.062) * strength;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(peak, start + 0.07);
        gain.gain.exponentialRampToValueAtTime(peak * 0.58, start + 0.36);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        source.connect(band);
        band.connect(gain);
        gain.connect(this.master);
        const offset = Math.max(0, Math.random() * Math.max(0.1, this.crowdBuffer.duration - duration - 0.1));
        source.start(start, offset, duration + 0.04);
      }
      const voiceCount = intensity > 1.2 ? 7 : 5;
      for (let i = 0; i < voiceCount; i += 1) {
        const start = now + 0.02 + Math.random() * 0.22;
        const osc = this.context.createOscillator();
        const gain = this.context.createGain();
        osc.type = i % 2 ? "triangle" : "sine";
        const base = 250 + Math.random() * 390;
        osc.frequency.setValueAtTime(base, start);
        osc.frequency.exponentialRampToValueAtTime(base * (1.25 + Math.random() * 0.55), start + 0.42 + Math.random() * 0.22);
        osc.frequency.exponentialRampToValueAtTime(base * 0.9, start + 0.95 + Math.random() * 0.24);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime((0.008 + Math.random() * 0.006) * strength, start + 0.055);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.95 + Math.random() * 0.32);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(start);
        osc.stop(start + 1.35);
      }
    },
    bounce() {
      this.tone(105, 0.045, "triangle", 0.035);
      this.tone(70, 0.06, "square", 0.012, 0.018);
    },
    shot() {

  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  }

  function easeInOutCubic(t) {
    t = clamp(t, 0, 1);
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

    let value = seed >>> 0;
    return () => {
      value += 0x6d2b79f5;
      let t = value;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shotMetrics() {
    const p = game.player;
    const distance = Math.max(80, HOOP.rimX - p.x);
    const far = distance > 560;
    const nearest = nearestDefenderDistance();
    const guaranteed = game.specialActive > 0;
    const contest = guaranteed ? 0 : (nearest < 210 ? clamp((210 - nearest) / 160, 0, 1) : 0);
    if (guaranteed) {
      return { distance, far, nearest, contest, greenHalf: 0.5, perfectHalf: 0.035, guaranteed: true };
    }
    let greenHalf = 0.145 - (far ? 0.028 : 0) - contest * 0.058;
    greenHalf = clamp(greenHalf, 0.045, 0.205);
    const perfectHalf = clamp(greenHalf * 0.21, 0.012, 0.035);
    return { distance, far, nearest, contest, greenHalf, perfectHalf, guaranteed: false };
  }

  function startShot() {
    if (game.state !== "playing") return;
    const p = game.player;
    if (!p.hasBall || game.shot.flight || game.shot.cooldown > 0 || p.dunkTimer > 0 || p.dribbleTimer > 0 || p.hitTimer > 0) return;
    game.shot.charging = true;
    game.shot.chargeTime = 0;
    p.action = "jump";
    p.actionTimer = 0.8;
    sound.init();
  }

  function releaseShot() {
    if (!game.shot.charging || game.state !== "playing") return;
    const p = game.player;
    const m = shotMetrics();
    game.shot.charging = false;
    game.shot.cooldown = 0.85;
    const error = Math.abs(game.shot.meter - 0.5);
    const perfect = error <= m.perfectHalf;
    let probability;
    if (perfect) probability = 1;
    else if (error <= m.greenHalf) probability = 0.92 - m.contest * 0.17;
    else if (error <= m.greenHalf * 1.6) probability = 0.40 - m.contest * 0.18;
    else probability = 0.07;
    if (m.nearest < 72 && !perfect && !m.guaranteed) probability *= 0.28;
    if (m.guaranteed) probability = 1;
    const made = m.guaranteed || random() < clamp(probability, 0.02, 1);
    const side = game.shot.meter < 0.5 ? -1 : 1;
    const missDistance = 28 + clamp(error / Math.max(m.greenHalf, 0.04), 0, 2.6) * 42;
    const startX = p.x + 34;
    const startY = p.y - 160 - p.jumpOffset;
    game.shot.flight = {
      t: 0,
      duration: clamp(0.67 + m.distance / 1900, 0.72, 1.08),
      sx: startX,
      sy: startY,
      ex: made ? HOOP.rimX : HOOP.rimX + side * missDistance,
      ey: made ? HOOP.rimY - 4 : HOOP.rimY - 20 - error * 25,
      arc: clamp(185 + m.distance * 0.18, 215, 330),
      made,
      perfect,
      far: m.far,
      contest: m.contest,
      special: m.guaranteed,
      rotation: 0,
      resolved: false
    };
    p.hasBall = false;
    p.shootTimer = 0.7;
    p.action = "jump";
    p.actionTimer = 0.85;
    game.shot.lastError = error;
    game.shot.lastContest = m.contest;
    game.shot.lastFar = m.far;
    sound.shot();
    haptic(12);
  }

  function triggerDribble() {
    const p = game.player;
    if (game.state !== "playing" || !p.hasBall || p.dribbleCooldown > 0 || game.shot.charging || game.shot.flight || p.dunkTimer > 0 || p.hitTimer > 0) return;
    p.dribbleTimer = 0.62;
    p.dribbleCooldown = 0.9;
    p.action = "crossover";
    p.actionTimer = 0.65;
    p.invulnerable = Math.max(p.invulnerable, 0.48);
    let rewarded = false;
    for (const d of game.defenders) {
      const dist = Math.hypot(d.x - p.x, (d.y - p.y) * 1.25);
      if (dist < 155 && d.stun <= 0) {
        d.stun = 1.15;
        d.vx = p.x < d.x ? 115 : -115;
        if (!d.rewarded) {
          d.rewarded = true;
          rewarded = true;
          addScore(160);
          addPenguins(1, "DRIBBLE RÉUSSI", p.x + 30, p.y - 160);
          addSpecial(14);
        }
      }
    }
    if (!rewarded) popup("CROSSOVER", "CRÉE TON ESPACE", p.x - 20, p.y - 155, C.cyan);
    sound.dribble();
    haptic(18);
  }

  function triggerDash() {
    const p = game.player;
    if (game.state !== "playing" || p.dashCooldown > 0 || game.shot.charging || p.dunkTimer > 0 || p.hitTimer > 0) return;
    p.dashTimer = 0.38;
    p.dashCooldown = 1.25;
    p.invulnerable = Math.max(p.invulnerable, 0.38);
    p.action = "drive";
    p.actionTimer = 0.45;
    sound.tone(150, 0.13, "sawtooth", 0.023);
    haptic(12);
  }

  function triggerDunk() {
    const p = game.player;
    if (game.state !== "playing" || !p.hasBall || p.dunkTimer > 0 || game.shot.flight || game.shot.charging || p.hitTimer > 0) return;
    const distance = HOOP.rimX - p.x;
    const waveDunk = game.specialActive > 0;
    if (!waveDunk && (distance < 72 || distance > 235)) {
      popup("DUNK", "RAPPROCHE-TOI DU PANIER", p.x - 25, p.y - 160, C.red);
      sound.deny();
      return;
    }
    const contest = nearestDefenderDistance();
    if (contest < 62 && !waveDunk) {
      popup("CONTRÉ", "CRÉE TON ESPACE", p.x, p.y - 170, C.red);
      sound.steal();
      game.shake = 8;
      return;
    }
    const travel = clamp(Math.abs(distance), 90, 860);
    p.dunkTimer = waveDunk ? clamp(1.02 + travel / 1750, 1.08, 1.52) : 1.18;
    p.dunkDuration = p.dunkTimer;
    p.dunkStartX = p.x;
    p.dunkStartY = p.y;
    p.dunkLandX = clamp(HOOP.rimX - 92, 940, 995);
    p.dunkLandY = clamp(p.y + 4, 520, 590);
    p.dunkApex = waveDunk ? clamp(88 + travel * 0.055, 96, 126) : 82;
    p.dunkSpecial = waveDunk;
    p.dunkProgress = 0;
    p.dunkRotation = 0;
    p.dunkScored = false;
    p.facing = 1;
    p.action = "dunk";
    p.actionTimer = p.dunkTimer;
    p.invulnerable = p.dunkTimer + 0.35;
    p.idleTime = 0;
    if (waveDunk && distance > 235) popup("WAVE DUNK", "DUNK DEPUIS N’IMPORTE OÙ", p.x - 20, p.y - 175, C.cyan);
    haptic(18);
  }

  function triggerSpecial() {
    if (game.state !== "playing" || game.player.hitTimer > 0) return;
    if (game.special < 100 || game.specialActive > 0) {
      popup("WAVE MODE", `${Math.round(game.special)}% · JAUGE INCOMPLÈTE`, game.player.x, game.player.y - 170, C.cyan);
      sound.deny();
      return;
    }
    game.special = 0;
    game.specialActive = 6.5;
    game.flash = 0.35;
    game.flashColor = C.cyan;
    burst(game.player.x, game.player.y - 100, C.cyan, 42, 260);
    announce("WAVE MODE", "TOUS LES TIRS RENTRENT · DUNK DEPUIS PARTOUT", 2.2);
    sound.special();
    haptic([25, 30, 25, 30, 50]);
  }

  function actionById(id) {
    if (id === "dribble") triggerDribble();
    else if (id === "dash") triggerDash();
    else if (id === "dunk") triggerDunk();
    else if (id === "special") triggerSpecial();
  }

  function scoreBasket(flight) {
    const reward = flight.far ? 3 : 1;
    const points = flight.far ? 300 : 150;
    game.baskets += 1;
    game.combo += 1;
    game.comboTimer = 4.2;
    game.level = 1 + Math.floor(game.baskets / 4);
    addScore(points + (flight.perfect ? 120 : 0));
    addPenguins(reward, flight.far ? "TIR DE LOIN" : (flight.perfect ? "PERFECT RELEASE" : "PANIER"), HOOP.rimX - 80, HOOP.rimY - 80);
    addSpecial(flight.far ? 24 : 16);
    game.netTimer = 0.52;
    game.flash = 0.16;
    game.flashColor = flight.perfect ? C.green : C.yellow;
    game.shake = flight.perfect ? 4 : 2;
    burst(HOOP.rimX, HOOP.rimY + 12, flight.perfect ? C.green : C.orange, 30, 210);
    sound.score();
    sound.crowdCheer(flight.far || flight.perfect ? 1.25 : 1.0);
    if (game.baskets % 3 === 0) spawnDefenders();
  }

  function scoreDunk() {
    game.baskets += 1;
    game.combo += 1;
    game.comboTimer = 4.2;
    game.level = 1 + Math.floor(game.baskets / 4);
    addScore(420);
    addPenguins(3, "DUNK", HOOP.rimX - 105, HOOP.rimY - 90);
    addSpecial(28);
    game.netTimer = 0.62;
    game.flash = 0.23;
    game.flashColor = C.orange;
    game.shake = 10;
    burst(HOOP.rimX, HOOP.rimY + 16, C.orange, 52, 285);
    sound.dunk();
    sound.crowdCheer(1.5);
    haptic([35, 25, 65]);
    if (game.baskets % 3 === 0) spawnDefenders();
  }

  function takeQuarterDamage(defender, reason = "ATTAQUE DÉFENSIVE") {
    const p = game.player;
    if (p.invulnerable > 0 || p.dashTimer > 0 || p.dribbleTimer > 0 || p.dunkTimer > 0 || game.specialActive > 0) return false;
    game.health = Math.max(0, game.health - 25);
    game.combo = 0;
    game.comboTimer = 0;
    game.special = Math.max(0, game.special - 10);
    p.invulnerable = 1.15;
    p.hitTimer = 0.38;
    p.idleTime = 0;
    const away = defender ? (p.x < defender.x ? -1 : 1) : -1;
    p.knockbackX = away * 125;
    game.shake = 9;
    game.flash = 0.2;
    game.flashColor = C.red;
    burst(p.x, p.y - 85, C.red, 24, 205);
    popup(reason, `-${25}% VIE`, p.x - 54, p.y - 175, C.red);
    sound.steal();
    haptic([32, 28, 48]);
    if (defender) {
      defender.attackCooldown = 2.05;
      defender.stealCooldown = 2.05;
    }

    if (game.health > 0) return false;

    game.lives -= 1;
    game.health = 100;
    popup("VIE ÉPUISÉE", "-1 CŒUR", p.x - 40, p.y - 205, C.red);
    if (game.lives <= 0) {
      game.state = "gameover";
      sound.setCrowdActive(false);
      saveProgress();
      return true;
    }
    resetPlayer(true);
    spawnDefenders();
    announce("REMISE EN JEU", "RESTE EN MOUVEMENT POUR ÉVITER L’ATTAQUE", 1.5);
    return true;
  }

  function turnover(defender) {
    return takeQuarterDamage(defender, "BALLON CHIPPÉ");
  }

  function movementVector() {
    let x = 0;
    let y = 0;
    if (input.keys.has("arrowleft")) x -= 1;
    if (input.keys.has("arrowright")) x += 1;
    if (input.keys.has("arrowup")) y -= 1;
    if (input.keys.has("arrowdown")) y += 1;
    if (input.joystick.active) {
      x += input.joystick.dx;
      y += input.joystick.dy;
    }
    const length = Math.hypot(x, y);
    if (length > 1) {
      x /= length;
      y /= length;
    }
    return { x, y };
  }

  function updatePlayer(dt) {
    const p = game.player;
    p.actionTimer = Math.max(0, p.actionTimer - dt);
    p.dribbleTimer = Math.max(0, p.dribbleTimer - dt);
    p.dribbleCooldown = Math.max(0, p.dribbleCooldown - dt);
    p.dashTimer = Math.max(0, p.dashTimer - dt);
    p.dashCooldown = Math.max(0, p.dashCooldown - dt);
    p.invulnerable = Math.max(0, p.invulnerable - dt);
    p.shootTimer = Math.max(0, p.shootTimer - dt);
    p.hitTimer = Math.max(0, p.hitTimer - dt);

    if (p.dunkTimer > 0) {
      p.dunkTimer = Math.max(0, p.dunkTimer - dt);
      const progress = clamp(1 - p.dunkTimer / p.dunkDuration, 0, 1);
      p.dunkProgress = progress;

      // Approach, hang at the rim, then land under control instead of teleporting.
      if (progress < 0.72) {
        const u = smoothstep(progress / 0.72);
        const one = 1 - u;
        const controlX = p.dunkStartX + Math.max(88, (HOOP.dunkX - p.dunkStartX) * 0.58);
        p.x = one * one * p.dunkStartX + 2 * one * u * controlX + u * u * HOOP.dunkX;
        p.y = lerp(p.dunkStartY, p.dunkLandY - 8, smoothstep(progress / 0.72));
      } else {
        const u = smoothstep((progress - 0.72) / 0.28);
        p.x = lerp(HOOP.dunkX, p.dunkLandX, u);
        p.y = lerp(p.dunkLandY - 8, p.dunkLandY, u);
      }

      const dunkApex = p.dunkApex || 82;
      const hangHeight = dunkApex * 0.93;
      if (progress < 0.58) {
        p.jumpOffset = dunkApex * easeOutCubic(progress / 0.58);
      } else if (progress < 0.75) {
        p.jumpOffset = lerp(dunkApex, hangHeight, smoothstep((progress - 0.58) / 0.17));
      } else {
        p.jumpOffset = hangHeight * (1 - smoothstep((progress - 0.75) / 0.25));
      }

      if (progress < 0.58) p.dunkRotation = lerp(-0.02, -0.12, smoothstep(progress / 0.58));
      else if (progress < 0.76) p.dunkRotation = -0.12;
      else p.dunkRotation = lerp(-0.12, 0.035, smoothstep((progress - 0.76) / 0.24));

      if (!p.dunkScored && progress >= 0.64) {
        p.dunkScored = true;
        p.hasBall = false;
        scoreDunk();
      }
      if (p.dunkTimer <= 0) {
        p.hasBall = true;
        p.x = p.dunkLandX;
        p.y = p.dunkLandY;
        p.jumpOffset = 0;
        p.dunkProgress = 1;
        p.dunkRotation = 0;
        p.action = "celebration";
        p.actionTimer = 0.8;
        p.idleTime = 0;
        game.shot.cooldown = 0.7;
      }
      return;
    }

    if (game.shot.charging) {
      game.shot.chargeTime += dt;
      const lift = clamp(game.shot.chargeTime / 0.62, 0, 1);
      p.jumpOffset = Math.sin(lift * Math.PI * 0.55) * 42;
      p.action = "jump";
      p.idleTime = 0;
      return;
    }

    if (p.shootTimer > 0) {
      p.jumpOffset = Math.sin((p.shootTimer / 0.7) * Math.PI) * 52;
      p.action = "jump";
      p.idleTime = 0;
    } else {
      p.jumpOffset = Math.max(0, p.jumpOffset - dt * 260);
    }

    const move = movementVector();
    const moving = Math.hypot(move.x, move.y) > 0.08;
    const sprint = p.dashTimer > 0;
    const specialBoost = game.specialActive > 0 ? 1.3 : 1;
    const speed = (sprint ? 330 : 198) * specialBoost;
    const laneSpeed = (sprint ? 205 : 145) * specialBoost;

    if (p.hitTimer > 0) {
      p.vx = lerp(p.vx, p.knockbackX, clamp(dt * 12, 0, 1));
      p.knockbackX *= Math.pow(0.035, dt);
      p.vy *= Math.pow(0.08, dt);
      p.action = "hesitation";
      p.idleTime = 0;
    } else {
      p.vx = lerp(p.vx, move.x * speed, clamp(dt * 11, 0, 1));
      p.vy = lerp(p.vy, move.y * laneSpeed, clamp(dt * 11, 0, 1));
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const minX = mode === "mobile" ? 390 : 220;
    p.x = clamp(p.x, minX, 990);
    p.y = clamp(p.y, 475, 625);
    if (Math.abs(move.x) > 0.05) p.facing = move.x >= 0 ? 1 : -1;

    const busy = p.dribbleTimer > 0 || p.dashTimer > 0 || p.hitTimer > 0 || p.shootTimer > 0 || game.shot.charging || Boolean(game.shot.flight);
    if (!moving && !busy && p.hasBall) p.idleTime += dt;
    else p.idleTime = 0;

    if (p.dribbleTimer > 0) p.action = "crossover";
    else if (p.hitTimer > 0) p.action = "hesitation";
    else if (p.actionTimer > 0 && p.action === "celebration") p.action = "celebration";
    else if (moving) p.action = sprint ? "drive" : "run";
    else p.action = "idle";

    if (p.hasBall && !game.shot.flight) {
      const cadence = p.dribbleTimer > 0 ? 4.85 : (moving ? 4.25 : 3.12);
      const impactIndex = Math.floor(game.elapsed * cadence - 0.5);
      if (impactIndex !== p.bounceCycle) {
        p.bounceCycle = impactIndex;
        sound.bounce();
      }
    }
  }

  function beginDefenderAttack(d, p) {
    d.attackDuration = 0.74;
    d.attackTimer = d.attackDuration;
    d.attackStartX = d.x;
    d.attackStartY = d.y;
    d.attackDir = p.x >= d.x ? 1 : -1;
    d.attackTargetX = p.x - d.attackDir * 47;
    d.attackTargetY = p.y;
    d.attackHit = false;
    d.vx = 0;
    d.vy = 0;
    popup("ATTENTION", "L’ADVERSAIRE ATTAQUE !", d.x - 55, d.y - 175, C.yellow);
    sound.tone(130, 0.1, "square", 0.018);
  }

  function updateDefenders(dt) {
    const p = game.player;
    let attackInProgress = game.defenders.some((entry) => entry.attackTimer > 0);

    for (const d of game.defenders) {
      d.stealCooldown = Math.max(0, d.stealCooldown - dt);
      d.attackCooldown = Math.max(0, d.attackCooldown - dt);

      if (d.stun > 0) {
        d.stun = Math.max(0, d.stun - dt);
        d.x += d.vx * dt;
        d.vx *= Math.pow(0.08, dt);
        d.attackTimer = 0;
        continue;
      }

      if (d.attackTimer > 0) {
        d.attackTimer = Math.max(0, d.attackTimer - dt);
        const t = clamp(1 - d.attackTimer / d.attackDuration, 0, 1);
        const windX = d.attackStartX - d.attackDir * 19;
        if (t < 0.24) {
          const u = smoothstep(t / 0.24);
          d.x = lerp(d.attackStartX, windX, u);
          d.y = lerp(d.attackStartY, d.attackStartY - 3, u);
        } else if (t < 0.64) {
          const u = smoothstep((t - 0.24) / 0.40);
          d.x = lerp(windX, d.attackTargetX, u);
          d.y = lerp(d.attackStartY - 3, d.attackTargetY, u);
        } else {
          const u = smoothstep((t - 0.64) / 0.36);
          const settleX = p.x - d.attackDir * 82;
          d.x = lerp(d.attackTargetX, settleX, u);
          d.y = lerp(d.attackTargetY, p.y, u);
        }
        d.jump = Math.sin(Math.PI * clamp((t - 0.18) / 0.68, 0, 1)) * 0.16;

        if (!d.attackHit && t >= 0.49) {
          d.attackHit = true;
          const close = Math.hypot(d.x - p.x, (d.y - p.y) * 1.35);
          if (close < 88) {
            const reset = takeQuarterDamage(d, "ATTAQUE DÉFENSIVE");
            if (reset) return;
          } else {
            popup("ESQUIVE", "L’ATTAQUE A MANQUÉ", p.x - 25, p.y - 170, C.cyan);
            addScore(45);
          }
        }
        if (d.attackTimer <= 0) {
          d.attackCooldown = 1.75 + random() * 0.45;
          d.jump = 0;
        }
        continue;
      }

      const shotPressure = game.shot.charging || game.shot.flight;
      const targetX = shotPressure ? p.x + 42 : p.x + 96;
      const targetY = p.y + (d.number % 2 ? 8 : -8);
      const dx = targetX - d.x;
      const dy = targetY - d.y;
      const dist = Math.hypot(dx, dy) || 1;
      const speed = 72 + game.level * 7 + (shotPressure ? 42 : 0);
      d.vx = lerp(d.vx, dx / dist * speed, clamp(dt * 4.5, 0, 1));
      d.vy = lerp(d.vy, dy / dist * speed * 0.58, clamp(dt * 4.5, 0, 1));
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.x = clamp(d.x, 520, 1010);
      d.y = clamp(d.y, 475, 625);
      const close = Math.hypot(d.x - p.x, (d.y - p.y) * 1.35);
      if (shotPressure && close < 145) d.jump = Math.min(1, d.jump + dt * 4.5);
      else d.jump = Math.max(0, d.jump - dt * 3.5);

      const playerOpenToAttack = p.idleTime >= 1.05 && p.hasBall && p.invulnerable <= 0 && p.dribbleTimer <= 0 && p.dashTimer <= 0 && p.dunkTimer <= 0 && !game.shot.charging && !game.shot.flight;
      if (!attackInProgress && playerOpenToAttack && close < 218 && d.attackCooldown <= 0) {
        beginDefenderAttack(d, p);
        attackInProgress = true;
        continue;
      }

      if (p.x > d.x + 72 && !d.passed) {
        d.passed = true;
        if (!d.rewarded && p.dribbleTimer > 0) {
          d.rewarded = true;
          addPenguins(1, "DRIBBLE RÉUSSI", p.x, p.y - 150);
          addScore(150);
          addSpecial(12);
        }
      }
    }
  }

  function updateShot(dt) {
    game.shot.cooldown = Math.max(0, game.shot.cooldown - dt);
    if (game.shot.charging) {
      const m = shotMetrics();
      const speed = 0.82 + m.distance / 1500 + m.contest * 0.16;
      game.shot.meter += game.shot.direction * dt * speed;
      if (game.shot.meter >= 1) {
        game.shot.meter = 1;
        game.shot.direction = -1;
      } else if (game.shot.meter <= 0) {
        game.shot.meter = 0;
        game.shot.direction = 1;
      }
    }

    const flight = game.shot.flight;
    if (!flight) return;
    flight.t += dt / flight.duration;
    flight.rotation += dt * 8;
    if (flight.t >= 1 && !flight.resolved) {
      flight.resolved = true;
      if (flight.made) scoreBasket(flight);
      else {
        game.combo = 0;
        game.comboTimer = 0;
        game.flash = 0.08;
        game.flashColor = C.red;
        popup("MANQUÉ", flight.contest > 0.55 ? "TIR CONTESTÉ" : "AJUSTE TON TIMING", HOOP.rimX - 140, HOOP.rimY - 75, C.red);
        sound.miss();
      }
    }
    if (flight.t > 1.2) {
      game.shot.flight = null;
      game.player.hasBall = true;
      game.player.action = "idle";
      game.player.x = clamp(game.player.x, mode === "mobile" ? 400 : 230, 970);
      if (!flight.made && game.player.x > 910) game.player.x = 760;
    }
  }

  function updateParticles(dt) {
    for (const p of game.particles) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 280 * dt;
      p.vx *= Math.pow(0.36, dt);
    }
    game.particles = game.particles.filter((p) => p.life > 0);
    for (const p of game.popups) {
      p.life -= dt;
      p.y -= 20 * dt;
    }
    game.popups = game.popups.filter((p) => p.life > 0);
  }

  function update(dt) {
    game.elapsed += dt;
    if (game.messageTimer > 0) game.messageTimer = Math.max(0, game.messageTimer - dt);
    game.flash = Math.max(0, game.flash - dt);
    game.shake = Math.max(0, game.shake - dt * 25);
    game.netTimer = Math.max(0, game.netTimer - dt);
    if (game.state !== "playing") {
      updateParticles(dt);
      return;
    }
    if (!STATIC_MODE) game.time = Math.max(0, game.time - dt);
    if (game.time <= 0) {
      game.state = "gameover";
      sound.setCrowdActive(false);
      saveProgress();
      return;
    }
    if (game.comboTimer > 0) {
      game.comboTimer = Math.max(0, game.comboTimer - dt);
      if (game.comboTimer <= 0) game.combo = 0;
    }
    if (game.specialActive > 0) {
      game.specialActive = Math.max(0, game.specialActive - dt);
      if (game.specialActive <= 0) announce("WAVE MODE TERMINÉ", "REMPLIS À NOUVEAU LA JAUGE", 1.3);
    }
    updateShot(dt);
    updatePlayer(dt);
    updateDefenders(dt);
    updateParticles(dt);
    if (mode === "mobile") {
      const viewWorldW = 900;
      const desired = ((game.player.x + HOOP.rimX) * 0.5) - viewWorldW * 0.5;
      game.cameraX = lerp(game.cameraX, clamp(desired, 0, WORLD_W - viewWorldW), clamp(dt * 5.5, 0, 1));
    }
  }

  function pathRoundRect(g, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + rr, y);
    g.arcTo(x + w, y, x + w, y + h, rr);
    g.arcTo(x + w, y + h, x, y + h, rr);
    g.arcTo(x, y + h, x, y, rr);
    g.arcTo(x, y, x + w, y, rr);
    g.closePath();
  }

  function panel(g, x, y, w, h, fill, stroke = C.cyan, lineWidth = 3, radius = 8) {
    g.save();
    pathRoundRect(g, x, y, w, h, radius);
    g.fillStyle = fill;
    g.fill();
    g.lineWidth = lineWidth;
    g.strokeStyle = stroke;
    g.stroke();
    g.restore();
  }

  function txt(g, text, x, y, size, color = C.white, align = "left", font = "Arial Black", stroke = 0) {
    g.save();
    g.font = `900 ${size}px ${font}, Arial, sans-serif`;
    g.textAlign = align;
    g.textBaseline = "top";
    if (stroke > 0) {
      g.lineWidth = stroke * 2;
      g.strokeStyle = "rgba(0,0,0,0.9)";
      g.strokeText(String(text), x, y);
    }
    g.fillStyle = color;
    g.fillText(String(text), x, y);
    g.restore();
  }

  function withSmooth(g, callback) {
    const previous = g.imageSmoothingEnabled;
    g.imageSmoothingEnabled = true;
    callback();
    g.imageSmoothingEnabled = previous;
  }

  function drawImageContain(g, img, x, y, w, h, padding = 0, smooth = true) {
    if (!img || !img.complete || !img.naturalWidth) return;
    const aw = Math.max(1, w - padding * 2);
    const ah = Math.max(1, h - padding * 2);
    const scale = Math.min(aw / img.naturalWidth, ah / img.naturalHeight);
    const dw = img.naturalWidth * scale;
    const dh = img.naturalHeight * scale;
    const draw = () => g.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    if (smooth) withSmooth(g, draw);
    else draw();
  }

    const gap = 3;

      g.shadowColor = "rgba(255,138,18,0.8)";
      g.shadowBlur = 16;

      const grad = g.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
      grad.addColorStop(0, "#ffb34a");
      grad.addColorStop(0.55, C.orange);
      grad.addColorStop(1, "#8c2e08");
      g.fillStyle = grad;
      g.beginPath();
      g.arc(0, 0, r, 0, TAU);
      g.fill();
      g.strokeStyle = "#27110a";
      g.lineWidth = Math.max(2, r * 0.11);
      g.beginPath();
      g.arc(0, 0, r * 0.98, 0, TAU);
      g.moveTo(-r, 0);
      g.lineTo(r, 0);
      g.moveTo(0, -r);
      g.bezierCurveTo(r * 0.45, -r * 0.35, r * 0.45, r * 0.35, 0, r);
      g.moveTo(0, -r);
      g.bezierCurveTo(-r * 0.45, -r * 0.35, -r * 0.45, r * 0.35, 0, r);
      g.stroke();

  function drawHoopFront(g) {
    const x = HOOP.rimX;
    const y = HOOP.rimY;
    g.save();
    // Rim tube with front highlight and dark underside.
    g.strokeStyle = "#3a1308";
    g.lineWidth = 15;
    g.beginPath();
    g.ellipse(x, y, 51, 13, 0.02, 0, TAU);
    g.stroke();
    g.strokeStyle = "#ff7e0d";
    g.lineWidth = 9;
    g.beginPath();
    g.ellipse(x, y - 2, 50, 12, 0.02, 0, TAU);
    g.stroke();
    g.strokeStyle = "#ffc063";
    g.lineWidth = 2;
    g.beginPath();
    g.ellipse(x, y - 5, 45, 8, 0.02, Math.PI * 1.08, Math.PI * 1.92);
    g.stroke();
    g.strokeStyle = "#c4460a";
    g.lineWidth = 9;
    g.beginPath();
    g.moveTo(x + 48, y - 1);
    g.lineTo(x + 79, y + 1);
    g.stroke();

    const sway = game.netTimer > 0 ? Math.sin(game.elapsed * 36) * 7 * (game.netTimer / 0.62) : 0;
    const bottomY = y + 75;
    g.strokeStyle = "rgba(245,251,255,0.95)";
    g.lineWidth = 3;
    const topPoints = 10;
    for (let i = 0; i <= topPoints; i += 1) {
      const topX = x - 43 + i * 8.6;
      const bottomX = x - 23 + i * 4.6 + sway * (i / topPoints - 0.5);
      g.beginPath();
      g.moveTo(topX, y + 7);
      g.lineTo(bottomX, bottomY);
      g.stroke();
    }
    for (let row = 1; row <= 5; row += 1) {
      const t = row / 6;
      const half = lerp(43, 23, t);
      const yy = lerp(y + 7, bottomY, t);
      g.beginPath();
      for (let i = 0; i <= 10; i += 1) {
        const xx = x - half + i * (half * 2 / 10) + sway * t * (i / 10 - 0.5);
        if (i === 0) g.moveTo(xx, yy);
        else g.lineTo(xx, yy + (i % 2 ? 2 : -2));
      }
      g.stroke();
    }
    g.restore();
  }

  function spriteTargetHeight(y, isPlayer = false) {
    const depth = clamp((y - 470) / 155, 0, 1);
    return (isPlayer ? 198 : 187) + depth * (isPlayer ? 32 : 27);
  }

  function drawSpriteAnchored(g, img, x, feetY, targetHeight, flip = 1, rotation = 0, glow = false) {
    if (!img || !img.complete || !img.naturalWidth) return;
    const scale = targetHeight / img.naturalHeight;
    const dw = img.naturalWidth * scale;
    const dh = img.naturalHeight * scale;
    const drawX = Math.round(-dw / 2);
    const drawY = Math.round(-dh);
    g.save();
    g.translate(Math.round(x), Math.round(feetY));
    g.rotate(rotation);
    g.scale(flip, 1);
    g.imageSmoothingEnabled = false;
    // Opaque dark outline: every sprite is drawn at full opacity, never faded.
    g.filter = "brightness(0) saturate(100%)";
    g.globalAlpha = 1;
    for (const [ox, oy] of [[-2, 0], [2, 0], [0, -2], [0, 2], [-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      g.drawImage(img, drawX + ox, drawY + oy, dw, dh);
    }
    g.filter = "none";
    if (glow) {
      g.shadowColor = "rgba(32,200,255,0.9)";
      g.shadowBlur = 18;
    }
    g.drawImage(img, drawX, drawY, dw, dh);
    g.restore();
  }

  function dribbleBallPosition(p) {
    const moving = Math.abs(p.vx) + Math.abs(p.vy) > 22;
    const cadence = p.dribbleTimer > 0 ? 5.05 : (moving ? 4.35 : 3.18);
    let cycle = (game.elapsed * cadence) % 1;
    if (p.dribbleTimer > 0) cycle = clamp(1 - p.dribbleTimer / 0.62, 0, 0.999);

    // Eight readable phases inspired by a traditional basketball dribble cycle:
    // catch, palm push, release, fall, floor compression, rebound, reach, catch.
    let down = 0;
    if (cycle < 0.14) {
      down = 0.09 * smoothstep(cycle / 0.14);
    } else if (cycle < 0.50) {
      const u = (cycle - 0.14) / 0.36;
      down = 0.09 + 0.91 * u * u;
    } else if (cycle < 0.56) {
      down = 1;
    } else if (cycle < 0.87) {
      const u = (cycle - 0.56) / 0.31;
      down = 1 - 0.94 * easeOutCubic(u);
    } else {
      const u = (cycle - 0.87) / 0.13;
      down = 0.06 * (1 - smoothstep(u));
    }

    const side = p.facing >= 0 ? 1 : -1;
    const floorY = p.y - 9 - p.jumpOffset * 0.08;
    const r = 21;
    const crossProgress = p.dribbleTimer > 0 ? clamp(1 - p.dribbleTimer / 0.62, 0, 1) : 0;
    const crossArc = p.dribbleTimer > 0 ? Math.sin(crossProgress * Math.PI) : 0;

    // During movement, the top of the ball meets the visible palm of the dribble pose.
    // When standing, the hand naturally sits a little lower.
    const topCenterY = p.y - (moving ? 94 : 73) - p.jumpOffset;
    const floorCenterY = floorY - r;
    const topCenterX = p.x + side * (moving ? 55 : 49);
    let ballX = topCenterX + side * (2.5 * Math.sin(cycle * Math.PI * 2) + down * 3.5);
    if (p.dribbleTimer > 0) {
      ballX = p.x + side * (53 - 92 * crossArc) + side * Math.sin(crossProgress * Math.PI * 2) * 2;
    }
    const ballY = lerp(topCenterY, floorCenterY, down);

    const impact = 1 - clamp(Math.abs(cycle - 0.53) / 0.055, 0, 1);
    const push = cycle < 0.22 ? Math.sin((cycle / 0.22) * Math.PI) : 0;
    const catchBlend = cycle > 0.84 ? smoothstep((cycle - 0.84) / 0.16) : 0;
    const pushContact = cycle < 0.18 ? 1 - smoothstep(cycle / 0.18) : 0;
    const contact = Math.max(pushContact, catchBlend);
    const phase = Math.min(7, Math.floor(cycle * 8));

    return {
      x: ballX,
      y: ballY,
      floorY,
      r,
      side,
      down,
      impact,
      cycle,
      phase,
      contact,
      push,
      catchBlend,
      moving,
      cadence,
      crossProgress,
      crossArc
    };
  }

  function drawDribblePalm(g, b) {
    if (b.contact <= 0.07) return;
    const alpha = clamp((b.contact - 0.07) / 0.93, 0, 1);
    const palmX = b.x - b.side * 1.5;
    const palmY = b.y - b.r + 2;

    g.save();
    g.translate(palmX, palmY);
    g.rotate(b.side * (0.14 - b.push * 0.05));
    g.globalAlpha = alpha;

    // Compact palm only: it never stretches toward the ball and therefore cannot form a cord.
    g.fillStyle = C.ink;
    g.beginPath();
    g.ellipse(0, 0, 9.5, 5.1, 0, 0, TAU);
    g.fill();
    g.fillStyle = "#71371f";
    g.beginPath();
    g.ellipse(-b.side * 0.5, -0.4, 8, 3.9, 0, 0, TAU);
    g.fill();
    g.fillStyle = "#b86b3d";
    g.beginPath();
    g.ellipse(-b.side * 1.2, -1.3, 5.7, 2.2, 0, 0, TAU);
    g.fill();

    // Three short finger pixels resting on the upper leather.
    g.strokeStyle = "rgba(213,139,79,0.95)";
    g.lineWidth = 1.6;
    for (let i = -1; i <= 1; i += 1) {
      g.beginPath();
      g.moveTo(-b.side * 3.5, i * 1.35 - 0.8);
      g.lineTo(b.side * 3.6, i * 1.15 - 0.8);
      g.stroke();
    }
    g.restore();
  }

  function drawPlayerBallAndHand(g, p, state = null) {
    if (!p.hasBall || game.shot.flight || p.dunkTimer > 0 || p.hitTimer > 0) return;
    const b = state || dribbleBallPosition(p);

    const airborne = clamp((b.floorY - b.y - b.r) / 105, 0, 1);
    const shadowScale = 1 - airborne * 0.56;
    g.save();
    g.fillStyle = `rgba(0,0,0,${0.24 + (1 - airborne) * 0.22})`;
    g.beginPath();
    g.ellipse(b.x, b.floorY + 7, 22 * shadowScale, 6 * shadowScale, 0, 0, TAU);
    g.fill();
    g.restore();

    if (b.impact > 0.18) {
      g.save();
      g.globalAlpha = b.impact * 0.72;
      g.strokeStyle = "#ffd278";
      g.lineWidth = 2;
      g.beginPath();
      g.ellipse(b.x, b.floorY + 1, 18 + b.impact * 10, 4 + b.impact * 2, 0, 0, TAU);
      g.stroke();
      g.fillStyle = "#fff1bd";
      for (const sx of [-1, 1]) {
        g.fillRect(Math.round(b.x + sx * (17 + b.impact * 8)), Math.round(b.floorY - 2 - b.impact * 4), 2, 2);
      }
      g.restore();
    }

    const squash = b.impact * 0.20;
    const reboundStretch = Math.pow(clamp((0.72 - b.down) / 0.72, 0, 1), 4) * 0.035;
    g.save();
    g.translate(b.x, b.y);
    g.scale(1 + squash * 0.72 - reboundStretch, 1 - squash + reboundStretch);
    drawBall(g, 0, 0, b.r, game.elapsed * 5.9 * b.side, game.specialActive > 0);
    g.restore();

    drawDribblePalm(g, b);
  }

  function dunkBallPosition(p, height) {
    const t = clamp(p.dunkProgress || 0, 0, 1);
    const feetY = p.y - p.jumpOffset;
    const handX = p.x + 21;
    const handY = feetY - height + 31;
    if (t < 0.64) {
      const lock = smoothstep((t - 0.40) / 0.24);
      return {
        x: lerp(handX, HOOP.rimX - 2, lock),
        y: lerp(handY, HOOP.rimY - 5, lock),
        r: 20,
        glow: true
      };
    }
    if (t < 0.82) {
      const u = smoothstep((t - 0.64) / 0.18);
      return {
        x: HOOP.rimX + Math.sin(u * Math.PI) * 3,
        y: lerp(HOOP.rimY - 4, HOOP.rimY + 69, u),
        r: lerp(20, 18, u),
        glow: true
      };
    }
    return null;
  }

  function drawSolo(g) {
    const p = game.player;
    let spriteName = p.action;
    if (!SPRITE_NAMES.includes(spriteName)) spriteName = "idle";
    let x = p.x;
    let feetY = p.y - p.jumpOffset;
    let rotation = 0;
    let dribbleState = null;

    if (p.hasBall && !game.shot.flight && !game.shot.charging && p.shootTimer <= 0 && p.dunkTimer <= 0 && p.hitTimer <= 0) {
      dribbleState = dribbleBallPosition(p);
    }

    if (p.dunkTimer > 0) {
      spriteName = "dunk";
      rotation = p.dunkRotation;
    } else if (game.shot.charging || p.shootTimer > 0) {
      spriteName = "jump";
    } else if (p.dribbleTimer > 0) {
      spriteName = "crossover";
    } else if (p.hitTimer > 0) {
      spriteName = "hesitation";
    } else if (dribbleState) {
      const moving = dribbleState.moving;
      // Eight-phase pose sequence, matching the ball cycle without drawing a fake arm.
      const movingPoses = ["dribble", "dribble", "run", "run", "run", "run", "dribble", "dribble"];
      const standingPoses = ["hesitation", "dribble", "idle", "idle", "idle", "idle", "dribble", "hesitation"];
      spriteName = (moving ? movingPoses : standingPoses)[dribbleState.phase];

      // A subtle torso response makes the bounce feel weighted while the feet remain planted.
      rotation += p.facing * (dribbleState.push * 0.014 - dribbleState.catchBlend * 0.009);
      x += p.facing * (dribbleState.push - dribbleState.catchBlend) * 1.7;
    }

    const img = assets.solo[spriteName] || assets.solo.idle;
    let height = spriteTargetHeight(p.y, true) + (p.dunkTimer > 0 ? 8 : 0);
    if (dribbleState && p.dribbleTimer <= 0) {
      height *= 1 - dribbleState.impact * 0.018;
    }

    const air = clamp(p.jumpOffset / 90, 0, 1);
    g.save();
    g.fillStyle = `rgba(0,0,0,${0.46 - air * 0.24})`;
    g.beginPath();
    g.ellipse(x, p.y + 5, lerp(42, 25, air), lerp(12, 7, air), 0, 0, TAU);
    g.fill();
    g.restore();

    if (game.specialActive > 0) {
      g.save();
      g.shadowColor = "rgba(32,200,255,1)";
      g.shadowBlur = 28;
      g.strokeStyle = "rgba(88,225,255,0.85)";
      g.lineWidth = 5;
      g.beginPath();
      g.ellipse(x, feetY - height * 0.48, 60, height * 0.5, 0, 0, TAU);
      g.stroke();
      g.restore();
    }

    drawSpriteAnchored(g, img, x, feetY, height, p.facing, rotation, game.specialActive > 0);

    if (p.dunkTimer > 0) {
      const dunkBall = dunkBallPosition(p, height);
      if (dunkBall) drawBall(g, dunkBall.x, dunkBall.y, dunkBall.r, game.elapsed * 7, dunkBall.glow);
    } else if (!game.shot.flight && !game.shot.charging && p.shootTimer <= 0) {
      drawPlayerBallAndHand(g, p, dribbleState);
    } else if (game.shot.charging && p.hasBall) {
      drawBall(g, x + 24, feetY - height + 27, 20, game.elapsed * 6, game.specialActive > 0);
    }
  }

  function drawDefenderAttackArm(g, d, height, jumpOffset) {
    if (d.attackTimer <= 0) return;
    const t = clamp(1 - d.attackTimer / d.attackDuration, 0, 1);
    const strike = Math.sin(Math.PI * clamp((t - 0.18) / 0.62, 0, 1));
    const side = d.attackDir || (game.player.x < d.x ? -1 : 1);
    const shoulderX = d.x + side * 10;
    const shoulderY = d.y - jumpOffset - height * 0.67;
    const elbowX = shoulderX + side * lerp(19, 30, strike);
    const elbowY = shoulderY + lerp(24, 18, strike);
    const handX = elbowX + side * lerp(22, 42, strike);
    const handY = elbowY + lerp(18, 4, strike);
    g.save();
    g.lineCap = "round";
    g.lineJoin = "round";
    g.strokeStyle = "#160b08";
    g.lineWidth = 15;
    g.beginPath();
    g.moveTo(shoulderX, shoulderY);
    g.lineTo(elbowX, elbowY);
    g.lineTo(handX, handY);
    g.stroke();
    g.strokeStyle = "#8d4b2d";
    g.lineWidth = 9;
    g.stroke();
    g.fillStyle = "#9e5936";
    g.strokeStyle = "#160b08";
    g.lineWidth = 3;
    g.beginPath();
    g.ellipse(handX, handY, 8, 6, side * 0.2, 0, TAU);
    g.fill();
    g.stroke();
    if (strike > 0.72) {
      g.strokeStyle = "rgba(255,78,55,0.65)";
      g.lineWidth = 3;
      g.beginPath();
      g.arc(handX - side * 8, handY, 24, side > 0 ? -0.8 : Math.PI - 0.8, side > 0 ? 0.8 : Math.PI + 0.8);
      g.stroke();
    }
    g.restore();
  }

  function drawDefender(g, d) {
    let spriteName = "idle";
    const speed = Math.hypot(d.vx, d.vy);
    if (d.stun > 0) spriteName = "hesitation";
    else if (d.attackTimer > 0) spriteName = "drive";
    else if (d.jump > 0.18) spriteName = "jump";
    else if (speed > 35) spriteName = "run";
    const img = assets.defender[spriteName] || assets.defender.idle;
    const jumpOffset = d.jump * 42;
    const height = spriteTargetHeight(d.y, false);
    g.save();
    g.fillStyle = "rgba(0,0,0,0.42)";
    g.beginPath();
    g.ellipse(d.x, d.y + 5, 38, 11, 0, 0, TAU);
    g.fill();
    g.restore();
    const flip = d.attackTimer > 0 ? d.attackDir : (game.player.x < d.x ? -1 : 1);
    const attackProgress = d.attackTimer > 0 ? clamp(1 - d.attackTimer / d.attackDuration, 0, 1) : 0;
    const rotation = d.stun > 0 ? Math.sin(game.elapsed * 18) * 0.07 : (d.attackTimer > 0 ? -flip * Math.sin(attackProgress * Math.PI) * 0.075 : 0);
    drawSpriteAnchored(g, img, d.x, d.y - jumpOffset, height, flip, rotation, false);
    drawDefenderAttackArm(g, d, height, jumpOffset);
    txt(g, d.number, d.x, d.y - height * 0.61 - jumpOffset, 17, C.white, "center", "Arial Black", 2);
    txt(g, "AFRICA", d.x, d.y - height * 0.47 - jumpOffset, 10, C.white, "center", "Arial Black", 2);
  }

  function drawShotArc(g) {
    if (!game.shot.charging) return;
    const p = game.player;
    const m = shotMetrics();
    const sx = p.x + 32;
    const sy = p.y - 158 - p.jumpOffset;
    const error = Math.abs(game.shot.meter - 0.5);
    const color = error <= m.perfectHalf ? "#b9ffe0" : error <= m.greenHalf ? C.green : error <= m.greenHalf * 1.7 ? C.yellow : C.red;
    g.save();
    g.strokeStyle = color;
    g.lineWidth = 4;
    g.setLineDash([10, 9]);
    g.shadowColor = color;
    g.shadowBlur = 9;
    g.beginPath();
    for (let i = 0; i <= 30; i += 1) {
      const t = i / 30;
      const x = lerp(sx, HOOP.rimX, t);
      const y = lerp(sy, HOOP.rimY - 5, t) - (230 + m.distance * 0.11) * 4 * t * (1 - t);
      if (i === 0) g.moveTo(x, y);
      else g.lineTo(x, y);
    }
    g.stroke();
    g.restore();
  }

  function drawShotBall(g) {
    const f = game.shot.flight;
    if (!f) return;
    const t = clamp(f.t, 0, 1.2);
    let x;
    let y;
    if (t <= 1) {
      x = lerp(f.sx, f.ex, t);
      y = lerp(f.sy, f.ey, t) - f.arc * 4 * t * (1 - t);
    } else {
      const fall = (t - 1) / 0.2;
      x = f.ex + (f.made ? 5 : (f.ex - HOOP.rimX) * 0.25) * fall;
      y = f.ey + fall * 94;
    }
    drawBall(g, x, y, 20, f.rotation, f.perfect);
  }

  function drawParticlesWorld(g) {
    for (const p of game.particles) {
      g.globalAlpha = clamp(p.life / Math.min(p.max, 0.35), 0, 1);
      g.fillStyle = p.color;
      const size = Math.max(1, Math.round(p.size));
      g.fillRect(Math.round(p.x), Math.round(p.y), size, size);
    }
    g.globalAlpha = 1;
  }

  function drawPopupsWorld(g) {
    for (const p of game.popups) {
      const alpha = clamp(p.life / 0.22, 0, 1);
      g.globalAlpha = alpha;
      panel(g, p.x - 16, p.y - 10, 218, 66, "rgba(2,8,16,0.9)", "#214664", 3, 3);
      txt(g, p.text, p.x, p.y, 16, C.white, "left", "Arial Black", 2);
      txt(g, p.sub, p.x, p.y + 25, 20, p.color, "left", "Arial Black", 2);
    }
    g.globalAlpha = 1;
  }

  function drawWorld() {
    drawArenaBase();
    wctx.save();
    const shakeX = game.shake > 0 ? (random() - 0.5) * game.shake : 0;
    const shakeY = game.shake > 0 ? (random() - 0.5) * game.shake * 0.45 : 0;
    wctx.translate(shakeX, shakeY);
    drawHoopBack(wctx);
    drawShotArc(wctx);
    const entities = game.defenders.map((d) => ({ y: d.y, type: "defender", value: d }));
    entities.push({ y: game.player.y, type: "player", value: game.player });
    entities.sort((a, b) => a.y - b.y);
    for (const e of entities) {
      if (e.type === "player") drawSolo(wctx);
      else drawDefender(wctx, e.value);
    }
    drawShotBall(wctx);
    drawHoopFront(wctx);
    drawParticlesWorld(wctx);
    drawPopupsWorld(wctx);
    wctx.restore();
  }

  function drawGauges() {
    const m = shotMetrics();
    const waveGuaranteed = game.specialActive > 0;
    const shotStatus = waveGuaranteed
      ? "WAVE MODE · 100% RÉUSSITE"
      : (game.shot.charging
          ? "RELÂCHE LE PINGOUIN AU CENTRE"
          : (m.far ? "TIR DE LOIN · +3 PINGOUINS" : `PRESSION ${Math.round(m.contest * 100)}%`));
    const t = drawGaugeFrame(ctx, ui.shotGauge, "AJUSTEMENT DU TIR", shotStatus, game.shot.charging || waveGuaranteed);
    ctx.save();
    pathRoundRect(ctx, t.x, t.y, t.w, t.h, 3);
    ctx.clip();
    if (waveGuaranteed) {
      const guaranteedFill = ctx.createLinearGradient(t.x, 0, t.x + t.w, 0);
      guaranteedFill.addColorStop(0, "#078a42");
      guaranteedFill.addColorStop(0.28, "#24d66f");
      guaranteedFill.addColorStop(0.5, "#8dffb8");
      guaranteedFill.addColorStop(0.72, "#24d66f");
      guaranteedFill.addColorStop(1, "#078a42");
      ctx.fillStyle = guaranteedFill;
      ctx.fillRect(t.x, t.y, t.w, t.h);
    } else {
      ctx.fillStyle = C.red;
      ctx.fillRect(t.x, t.y, t.w, t.h);
      ctx.fillStyle = "#efaa2a";
      ctx.fillRect(t.x + t.w * 0.16, t.y, t.w * 0.68, t.h);
      ctx.fillStyle = C.green;
      ctx.fillRect(t.x + t.w * (0.5 - m.greenHalf), t.y, t.w * (m.greenHalf * 2), t.h);
      ctx.fillStyle = "#78f2bc";
      ctx.fillRect(t.x + t.w * (0.5 - m.perfectHalf), t.y, t.w * (m.perfectHalf * 2), t.h);
    }
    ctx.fillStyle = "#effff7";
    ctx.fillRect(t.x + t.w * 0.497, t.y, Math.max(4, t.w * 0.006), t.h);
    const shine = ctx.createLinearGradient(0, t.y, 0, t.y + t.h);
    shine.addColorStop(0, "rgba(255,255,255,0.36)");
    shine.addColorStop(0.3, "rgba(255,255,255,0.05)");
    shine.addColorStop(1, "rgba(0,0,0,0.32)");
    ctx.fillStyle = shine;
    ctx.fillRect(t.x, t.y, t.w, t.h);
    const divisions = mode === "mobile" ? 24 : 28;
    for (let i = 1; i < divisions; i += 1) {
      ctx.fillStyle = i % 6 === 0 ? "rgba(255,255,255,0.43)" : "rgba(0,0,0,0.2)";
      ctx.fillRect(Math.round(t.x + t.w * i / divisions), t.y, i % 6 === 0 ? 2 : 1, t.h);
    }
    ctx.restore();
    ctx.strokeStyle = "rgba(219,247,255,0.9)";
    ctx.lineWidth = 2;
    pathRoundRect(ctx, t.x, t.y, t.w, t.h, 3);
    ctx.stroke();
    const shotX = clamp(t.x + t.w * game.shot.meter, t.x + 32, t.x + t.w - 32);
    drawPenguinNeedle(ctx, shotX, t, game.shot.charging || waveGuaranteed, 1);

    const shown = game.specialActive > 0 ? 100 : game.special;
    const specialStatus = game.specialActive > 0 ? `WAVE MODE ${game.specialActive.toFixed(1)}s` : `${Math.round(shown)}%`;
    const st = drawGaugeFrame(ctx, ui.specialGauge, "CAPACITÉ SPÉCIALE", specialStatus, shown >= 100 || game.specialActive > 0);
    ctx.save();
    pathRoundRect(ctx, st.x, st.y, st.w, st.h, 3);
    ctx.clip();
    ctx.fillStyle = "#081a2e";
    ctx.fillRect(st.x, st.y, st.w, st.h);
    const energy = ctx.createLinearGradient(st.x, 0, st.x + st.w, 0);
    energy.addColorStop(0, "#0754c6");
    energy.addColorStop(0.55, "#1cc9ff");
    energy.addColorStop(1, "#b8f7ff");
    ctx.fillStyle = energy;
    ctx.fillRect(st.x, st.y, st.w * shown / 100, st.h);
    const gloss = ctx.createLinearGradient(0, st.y, 0, st.y + st.h);
    gloss.addColorStop(0, "rgba(255,255,255,0.36)");
    gloss.addColorStop(0.38, "rgba(255,255,255,0.04)");
    gloss.addColorStop(1, "rgba(0,0,0,0.35)");
    ctx.fillStyle = gloss;
    ctx.fillRect(st.x, st.y, st.w, st.h);
    const segments = mode === "mobile" ? 20 : 20;
    for (let i = 1; i < segments; i += 1) {
      ctx.fillStyle = i % 5 === 0 ? "rgba(230,250,255,0.36)" : "rgba(0,0,0,0.2)";
      ctx.fillRect(Math.round(st.x + st.w * i / segments), st.y, i % 5 === 0 ? 2 : 1, st.h);
    }
    ctx.restore();
    ctx.strokeStyle = "rgba(171,235,255,0.84)";
    ctx.lineWidth = 2;
    pathRoundRect(ctx, st.x, st.y, st.w, st.h, 3);
    ctx.stroke();
    const specialX = clamp(st.x + st.w * shown / 100, st.x + 32, st.x + st.w - 32);
    drawPenguinNeedle(ctx, specialX, st, shown >= 100 || game.specialActive > 0, 0.95);
  }

  function drawActionIcon(g, type, cx, cy, scale = 1) {

    g.lineWidth = 7;
    g.lineCap = "round";
    g.lineJoin = "round";
    if (type === "dribble") {
      g.beginPath(); g.arc(-6, -22, 7, 0, TAU); g.fill();
      g.beginPath(); g.moveTo(-5, -13); g.lineTo(-9, 11); g.lineTo(-25, 31); g.moveTo(-8, 7); g.lineTo(11, 28); g.moveTo(-3, -7); g.lineTo(20, 2); g.stroke();
      drawBall(g, 27, 11, 8, 0);
    } else if (type === "dash") {
      g.beginPath(); g.arc(2, -20, 7, 0, TAU); g.fill();
      g.beginPath(); g.moveTo(2, -11); g.lineTo(-8, 10); g.lineTo(-29, 24); g.moveTo(-4, 7); g.lineTo(19, 26); g.moveTo(0, -7); g.lineTo(24, -17); g.stroke();
      g.lineWidth = 4;
      for (let i = 0; i < 3; i += 1) { g.beginPath(); g.moveTo(-38 - i * 7, -5 + i * 9); g.lineTo(-23 - i * 7, -5 + i * 9); g.stroke(); }
    } else if (type === "dunk") {
      g.beginPath(); g.arc(-6, -18, 7, 0, TAU); g.fill();
      g.beginPath(); g.moveTo(-5, -9); g.lineTo(-6, 15); g.lineTo(-20, 31); g.moveTo(-4, 12); g.lineTo(12, 29); g.moveTo(-4, -2); g.lineTo(11, -24); g.stroke();
      drawBall(g, 14, -29, 7, 0);
      g.lineWidth = 3; g.strokeRect(27, -32, 14, 11); g.beginPath(); g.moveTo(25, -19); g.lineTo(42, -19); g.stroke();
    } else {
      g.beginPath(); g.arc(0, -18, 7, 0, TAU); g.fill();
      g.beginPath(); g.moveTo(0, -9); g.lineTo(0, 14); g.moveTo(0, -1); g.lineTo(-23, -18); g.moveTo(0, -1); g.lineTo(23, -18); g.moveTo(0, 12); g.lineTo(-16, 31); g.moveTo(0, 12); g.lineTo(16, 31); g.stroke();
      for (let i = 0; i < 6; i += 1) { const a = i * TAU / 6 + game.elapsed; g.fillRect(Math.cos(a) * 34 - 2, Math.sin(a) * 34 - 2, 4, 4); }
    }

  function drawActionCard(g, button, compact = false) {

    const bg = g.createLinearGradient(0, button.y, 0, button.y + button.h);
    bg.addColorStop(0, special ? (ready ? "#873103" : "#4d1b04") : "#0b396b");

  function render() {
    if (!assetsReady) {
      ctx.fillStyle = C.navy;
      ctx.fillRect(0, 0, W, H);
      return;
    }
    if (game.state === "title") drawTitle();
    else if (game.state === "paused") drawPause();
    else if (game.state === "gameover") drawGameOver();
    else drawGameplay();
  }

  function togglePause() {
    if (game.state === "playing") game.state = "paused";
    else if (game.state === "paused") game.state = "playing";
    sound.setCrowdActive(game.state === "playing");
  }

  function keyName(event) {
    return String(event.key || "").toLowerCase();
  }

  window.addEventListener("keydown", (event) => {
    const key = keyName(event);
    if (["arrowleft", "arrowright", "arrowup", "arrowdown", " ", "s", "d", "f", "g"].includes(key)) event.preventDefault();
    input.keys.add(key);
    sound.init();
    if (key === "enter" && (game.state === "title" || game.state === "gameover")) {
      newGame();
      return;
    }
    if (key === "p" || key === "escape") {
      togglePause();
      return;
    }
    if (key === "h") {
      shell.requestFullscreen?.().catch(() => {});
      return;
    }
    if (key === "m") {
      sound.setMuted(!sound.muted);
      return;
    }
    if (event.repeat || game.state !== "playing") return;
    if (key === "j" || key === " ") startShot();
    else if (key === "s") triggerDribble();
    else if (key === "d") triggerDash();
    else if (key === "f") triggerDunk();
    else if (key === "g") triggerSpecial();
  }, { passive: false });

  window.addEventListener("keyup", (event) => {
    const key = keyName(event);
    input.keys.delete(key);
    if (key === "j" || key === " ") releaseShot();
  });

  window.addEventListener("blur", () => {
    input.keys.clear();
    if (game.shot.charging) releaseShot();
    input.joystick.active = false;
    input.joystick.pointerId = null;
    input.shootPointerId = null;
    input.actionPointers.clear();
    if (game.state === "playing") game.state = "paused";
    sound.setCrowdActive(false);
  });

  function canvasPoint(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * W / rect.width,
      y: (event.clientY - rect.top) * H / rect.height
    };
  }

  function inRect(point, rect) {
    return point.x >= rect.x && point.x <= rect.x + rect.w && point.y >= rect.y && point.y <= rect.y + rect.h;
  }

  function inCircle(point, circle) {
    return Math.hypot(point.x - circle.cx, point.y - circle.cy) <= circle.r * 1.22;
  }

  canvas.addEventListener("contextmenu", (event) => event.preventDefault());

  canvas.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    sound.init();
    canvas.setPointerCapture?.(event.pointerId);
    const p = canvasPoint(event);
    if (game.state === "title" || game.state === "gameover") {
      newGame();
      return;
    }
    if (game.state === "paused") {
      togglePause();
      return;
    }
    if (game.state !== "playing") return;
    if (inRect(p, ui.pause)) {
      togglePause();
      return;
    }
    if (mode === "mobile" && inCircle(p, ui.joystick) && input.joystick.pointerId === null) {
      input.joystick.pointerId = event.pointerId;
      input.joystick.active = true;
      input.joystick.x = p.x;
      input.joystick.y = p.y;
      input.joystick.dx = clamp((p.x - ui.joystick.cx) / 45, -1, 1);
      input.joystick.dy = clamp((p.y - ui.joystick.cy) / 45, -1, 1);
      return;
    }
    if (inRect(p, ui.shoot)) {
      input.shootPointerId = event.pointerId;
      startShot();
      return;
    }
    const button = ui.buttons.find((b) => inRect(p, b));
    if (button) {
      input.actionPointers.set(event.pointerId, button.id);
      actionById(button.id);
      return;
    }
    if (mode === "desktop" && p.x >= ui.shotGauge.x && p.x <= ui.shotGauge.x + ui.shotGauge.w && p.y >= ui.shotGauge.y - 8 && p.y <= ui.shotGauge.y + ui.shotGauge.h + 8) {
      input.shootPointerId = event.pointerId;
      startShot();
    }
  }, { passive: false });

  canvas.addEventListener("pointermove", (event) => {
    if (input.joystick.pointerId !== event.pointerId) return;
    const p = canvasPoint(event);
    const dx = p.x - ui.joystick.cx;
    const dy = p.y - ui.joystick.cy;
    const len = Math.hypot(dx, dy) || 1;
    const mag = Math.min(1, len / 48);
    input.joystick.dx = dx / len * mag;
    input.joystick.dy = dy / len * mag;
  }, { passive: false });

  function endPointer(event) {
    if (input.shootPointerId === event.pointerId) {
      releaseShot();
      input.shootPointerId = null;
    }
    if (input.joystick.pointerId === event.pointerId) {
      input.joystick.pointerId = null;
      input.joystick.active = false;
      input.joystick.dx = 0;
      input.joystick.dy = 0;
    }
    input.actionPointers.delete(event.pointerId);
  }

  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => configureLayout(false), 80);
  });
  window.addEventListener("orientationchange", () => setTimeout(() => configureLayout(true), 150));

  window.WTB_VERSION = "V8.4-RESPONSIVE-WAVE-SCORER-CROWD";
  window.WTBGame = {
    start: newGame,
    pause: togglePause,
    action: actionById,
    shootStart: startShot,
    shootRelease: releaseShot,
    setLayout(next) {
      window.WTB_FORCE_LAYOUT = next;
      configureLayout(true);
    },
    clearMessage() {
      game.messageTimer = 0;
    },
    setSpecial(value) {
      game.special = clamp(Number(value) || 0, 0, 100);
    },
    snapshot() {
      return {
        mode,
        state: game.state,
        score: game.score,
        lives: game.lives,
        health: game.health,
        time: game.time,
        level: game.level,
        baskets: game.baskets,
        penguins: game.penguins,
        careerPenguins: game.careerPenguins,
        special: game.special,
        specialActive: game.specialActive,
        crowdActive: sound.crowdWanted && !sound.muted,
        shotMeter: game.shot.meter,
        shotCharging: game.shot.charging,
        shotFlight: Boolean(game.shot.flight),
        playerHasBall: game.player.hasBall,
        player: { x: game.player.x, y: game.player.y },
        defenders: game.defenders.length
      };
    },
    demo(type = "dribble") {
      if (game.state !== "playing") newGame();
      if (type === "waveDunk") {
        game.player.x = mode === "mobile" ? 410 : 245;
        game.player.y = 565;
        game.special = 100;
        triggerSpecial();
        triggerDunk();
      } else if (type === "special") {
        game.special = 100;
        triggerSpecial();
      } else if (type === "shoot") {
        game.player.x = 500;
        game.shot.meter = 0.5;
        startShot();
      } else if (type === "dunk") {
        game.player.x = 900;
        triggerDunk();
      } else if (type === "attack") {
        game.player.x = mode === "mobile" ? 610 : 650;
        game.player.y = 565;
        game.player.idleTime = 1.2;
        if (game.defenders[0]) {
          game.defenders[0].x = game.player.x + 150;
          game.defenders[0].y = game.player.y;
          game.defenders[0].attackCooldown = 0;
        }
      } else {
        game.player.x = mode === "mobile" ? 500 : 360;
        triggerDribble();
      }
    }
  };

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    update(dt || 1 / 60);
    render();
    requestAnimationFrame(loop);
  }

  configureLayout(true);
  loadPromise.then(() => {
    assetsReady = true;
    loading.classList.add("is-hidden");
    if (AUTO_START) {
      newGame();
      if (DEMO_MODE) setTimeout(() => window.WTBGame.demo(DEMO_MODE), 250);
    }
    render();
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
